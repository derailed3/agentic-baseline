name: checks

# The required server check (tier 3). Branch protection on main requires every job below by name:
#   verify (ubuntu-latest), verify (windows-latest), verify (macos-latest), scan, lint-workflows
# Renaming a job means updating scripts/github_protect.py and re-applying protection in the same PR.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install packages
        run: python -m pip install -r requirements.txt

      - name: Validator, tests, trigger cases, layout, line endings, personal data
        run: python scripts/verify.py

      - name: Deploy step works (copies written, then in sync)
        shell: bash
        run: |
          python scripts/deploy_skills.py
          python scripts/deploy_skills.py --check

      - name: Setup scripts parse
        shell: bash
        run: sh -n scripts/setup.sh

      - name: PowerShell setup parses
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/scripts/setup.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors) { $errors; exit 1 }

  scan:
    name: scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # scan the whole history, not just the tip

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Secret scan (gitleaks, full history)
        env:
          GITLEAKS_VERSION: "8.21.2"
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git . --no-banner --redact --config .gitleaks.toml

      - name: Personal-data scan
        run: python scripts/scan_personal_data.py

  lint-workflows:
    name: lint-workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: actionlint
        run: |
          python -m pip install "actionlint-py==1.7.12.25"
          actionlint
